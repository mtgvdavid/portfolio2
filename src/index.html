<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="font-main">
    <header
      class="flex flex-row justify-between items-center px-8 lg:px-30 py-9 bg-black text-white"
    >
      <div class="flex flex-row items-center gap-4">
        <div class="size-12">
          <img src="./img/icon_logo.png" alt="Logo do site" />
        </div>
        <h1 class="text-4xl">Portfólio</h1>
      </div>
      <div class="hidden lg:flex lg:flex-row items-center gap-8">
        <a class="text-2xl hover:text-main transition duration-200" href="#"
          >Início</a
        >
        <a class="text-2xl hover:text-main transition duration-200" href="#"
          >Projetos</a
        >
        <a
          href="#"
          class="text-2xl font-semibold text-white bg-main px-4 py-2 rounded-2xl hover:bg-teal-600 transition duration-200"
        >
          Fale Conosco
        </a>
      </div>
      <div class="size-8 lg:hidden">
        <img src="./img/icon_hamburguer.png" alt="" />
      </div>
      <section
        class="flex flex-col lg:flex-row-reverse min-h-screen items-center text-black px-6 lg:px-30 py-16 bg-white"
      >
        <div
          class="lg:w-1/2 max-w-[400px] max-h-[400px] lg:max-w-[700px] lg:max-h-[700px]"
        >
          <img
            src="./img/sally.png"
            alt="Imagem da Sally, mascote da byron.solutions"
          />
        </div>
        <div class="lg:w-1/2 lg:max-w[560px] flex flex-col gap-12">
          <div
            class="text-center lg:text-start flex flex-col items-center lg:items-start gap-8"
          >
            <div class="flex flex-col gap-8 max-w-3/4">
              <h2 class="text-5xl">
                Conheça a <span class="text-secondary"> Sally</span>
              </h2>
              <div class="flex flex-col gap-4">
                <h3 class="text-2xl">
                  A mascote da
                  <span class="text-secondary"> byron.solutions!</span>
                </h3>
                <p class="text-base">
                  Lorem ipsum dolor, sit amet consectetur adipisicing elit.
                  Sapiente doloribus sint accusamus amet eius, laborum soluta
                  necessitatibus provident ex minima.
                </p>
              </div>
            </div>
            <button
              class="text-2xl font-semibold text-white bg-main px-4 py-2 rounded-2xl hover:bg-teal-600 transition duration-200"
            >
              SAIBA MAIS
            </button>
          </div>
          <div
            class="flex flex-row justify-between items-center lg:justify-start gap-8"
          >
            <p class="text-2xl">Nos contate!</p>
            <div class="flex flex-row gap-6">
              <div class="size-12">
                <a href="#">
                  <img src="./img/icon_instagram.png" alt="" />
                </a>
              </div>
              <div class="size-12">
                <a href="#"><img src="./img/icon_linkedin.png" alt="" /> </a>
              </div>
              <div class="size-12">
                <a href="#"><img src="./img/icon_whatsapp.png" alt="" /></a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
